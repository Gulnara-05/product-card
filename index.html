<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
</head>

<body>
  <template id="product-template">
    <div class="product-card">
      <img src="" alt="" class="product-image">
      <p class="category"></p>
      <h3 class="product-title"></h3>
      <p class="desc"></p>
      <div class="composition">
        <h4>Состав</h4>
        <ul class="composition-list"></ul>
      </div>
      <div class="price-row">
        <span>Цена</span>
        <span class="price-value"></span>
      </div>
    </div>
  </template>
  <div class="main-container">
    <div class="list"></div>
    <h1 class="title">Выбери свой продукт</h1>
    <button id="recolor-first-card-button">Перекрасить фон первой карточки</button>
    <button id="recolor-all-card-button">Перекрасить фон всех карточек</button>
    <button id="open-google-button">Открыть Google</button>
    <button id="recolor-button" class="action-button">Сменить цвет</button>
    <button id="openModalBtn">Зарегистрироваться</button>
    <footer class="footer">
      <nav class="footer-nav">
        <ul>
          <li><a href="#">Главная</a></li>
          <li><a href="#">О нас</a></li>
          <li><a href="#">Контакты</a></li>
        </ul>
      </nav>
      <div class="footer-form-container">
        <h3>Подпишитесь</h3>
        <form id="subscribeForm">
          <label for="footer-email">Email:</label>
          <input type="email" id="footer-email" name="email" placeholder="example@mail.com" required>
          <button type="submit">Подписаться</button>
        </form>
      </div>
    </footer>

    <div id="overlay" class="overlay"></div>
    <div id="regModal" class="modal">
      <button class="close-modal">&times;</button>
      <h2>Регистрация</h2>
      <form id="registrationForm">
        <div class="form-group">
          <label>Имя: <input type="text" name="firstName" placeholder="Имя" required></label>
        </div>
        <div class="form-group">
          <label>Фамилия: <input type="text" name="lastName" placeholder="Фамилия" required></label>
        </div>
        <div class="form-group">
          <label>Дата рождения: <input type="date" name="birthDate" required></label>
        </div>
        <div class="form-group">
          <label>Логин: <input type="text" name="login" placeholder="login" required></label>
        </div>
        <div class="form-group">
          <label>Пароль: <input type="password" id="pass" name="password" placeholder="**" required></label>
        </div>
        <div class="form-group">
          <label>Повтор пароля: <input type="password" id="confirmPass" name="confirmPassword" placeholder="**"
              required></label>
        </div>
        <button type="submit">Зарегистрироваться</button>
      </form>
      <button class="close-modal" id="closeModalBtn">&times;</button>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
