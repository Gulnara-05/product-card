<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <template id="product-template">
    <div class="product-card">
      <img src="" alt="" class="product-image">
      <p class="category"></p>
      <h3 class="product-title"></h3>
      <p class="desc"></p>
      <div class="composition">
        <h4>Состав</h4>
        <ul class="composition-list"></ul>
      </div>
      <div class="price-row">
        <span>Цена</span>
        <span class="price-value"></span>
      </div>
    </div>
  </template>
  <div class="main-container">
    <div class="list"></div>
    <h1 class="title">Выбери свой продукт</h1>
    <button id="recolor-first-card-button">Перекрасить фон первой карточки</button>
    <button id="recolor-all-card-button">Перекрасить фон всех карточек</button>
    <button id="open-google-button">Открыть Google</button>
    <button id="recolor-button" class="action-button">Сменить цвет</button>
    <script src="./script.js"></script>
    <script src="./homework-5.js"></script>
    <script src="./homework-6.js"></script>
    <script src="./homework-7.js" type="module"></script>
    <script src="./homework-8.js" type="module"></script>
</body>
</html>
